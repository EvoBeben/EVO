name: Refresh market data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13-22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch latest available quotes
        run: node scripts/fetch-market-data.mjs data/market.json
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- data/market.json; then
            echo "No market-data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git commit -m "Refresh market data"
          git push
